<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Wish</title>

    <style>
        body {
            margin: 0;
            opacity: 1;
            transition: opacity 1.2s ease-in-out;
        }

        body.fade-out {
            opacity: 0;
        }

        main {
            width: 100%;
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 400px;
            min-height: 200px;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
            box-sizing: border-box;

            text-align: center;

            font-family: Arial, sans-serif;
            font-size: 28px;
            font-weight: 600;
            line-height: 1.4;

            border-radius: 15px;
            background-color: #f5f5f5;
            color: #222;
        }

        button {
            margin: 40px;
            padding: 10px 20px;

            border-radius: 5px;
            border: 2px solid black;

            background-color: crimson;
            color: azure;

            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: white;
            color: black;
        }
    </style>
</head>

<body>

    <main>

        <div class="box"></div>

        <button id="refreshBtn">Refresh</button>

    </main>

    <script src="./main.js"></script>

</body>

</html>
